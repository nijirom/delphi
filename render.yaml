# Render Blueprint: the public indexer behind the Vercel dashboard's /api/* rewrite, and the devnet agent stack.
services:
  - type: web
    name: delphi-indexer
    runtime: node
    plan: starter
    branch: main
    buildCommand: npm ci --include=dev
    startCommand: npm run start -w @delphi/indexer
    disk:
      name: indexer-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: INDEXER_SOURCE
        value: rpc
      - key: INDEXER_HOST
        value: 0.0.0.0
      - key: INDEXER_PORT
        value: "10000"
      - key: DELPHI_PROGRAM_ID
        value: EVqrBtTWaQiwnrhXzDgqr5TML6oDpHqHs5jjeLLg42Qc
      # Public devnet RPC rate-limits getProgramAccounts; 30 s keeps snapshots well under the dashboard's 180 s staleness limit.
      - key: INDEXER_POLL_MS
        value: "30000"
      - key: STREAMS_WEBHOOK_SECRET
        generateValue: true
      - key: SOLANA_RPC_URL
        sync: false

  # Forecaster (public), x402 facilitator, resolver, two settlement signers and the buyer; see scripts/run-render.sh.
  # Keys and .env come from the secret file delphi-bundle.b64. Never run this while run-devnet.sh runs elsewhere:
  # both would post and reveal with the same persona keys.
  - type: web
    name: delphi-stack
    runtime: node
    # Six Node services at ~150 MB each exceed Starter's 512 MB.
    plan: standard
    branch: main
    buildCommand: npm ci --include=dev
    startCommand: bash scripts/run-render.sh
    disk:
      name: stack-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
    envVars:
      - key: TELEMETRY_INDEXER_URL
        value: https://delphi-indexer-063i.onrender.com
      - key: TELEMETRY_INDEXER_SECRET
        fromService:
          type: web
          name: delphi-indexer
          envVarKey: STREAMS_WEBHOOK_SECRET
      - key: BUYER_DRY_RUN
        value: "true"
